<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Shared semantic judgement in the harness</title><desc id="desc">Four peer memory processes apply shared policy and use structured computation, semantic judgement and generative investigation. Scoped reads supply selected source contents. The main task receives bounded findings and events. The host enforces access, disclosure, budgets and authorised effects.</desc>
