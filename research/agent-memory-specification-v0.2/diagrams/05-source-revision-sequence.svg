<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-labelledby="title desc">
<title id="title">Source revision with a scoped investigation</title><desc id="desc">A host event activates a memory-owned intention. The main task receives relevant records and gives a scoped investigation its brief and references. The host supplies selected evidence to the investigation workspace. A bounded finding and result reference return to the main task. Formation preserves experience and maintenance checks intention completion. Committed changes reach relevant open work through activation.</desc>
