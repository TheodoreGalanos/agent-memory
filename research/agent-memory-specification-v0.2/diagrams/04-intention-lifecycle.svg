<text x="46" y="111.0" font-family="Lato, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#176D61">pending</text>
<text x="46" y="142.0" font-family="Lato, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#243447">definition / readiness</text>
