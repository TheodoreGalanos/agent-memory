<text x="258" y="344.0" font-family="Lato, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#243447">deadline / lifecycle boundary</text>
<rect x="625" y="280" width="285" height="88" rx="12" fill="#F4F6F8" stroke="#9A6B25" stroke-width="2"/>
