<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1350" viewBox="0 0 1200 1350" role="img" aria-labelledby="title desc">
<title id="title">System composition: two stores, four peer processes</title><desc id="desc">Users and authorised operators contribute direction, evidence and corrections through the input and policy paths and receive inspectable findings, commitments and decision requests. Workspace and collection hold state. Formation, activation, consolidation and maintenance are peer processes. Maintenance receives cited use and outcome feedback and supplies priorities and change events to activation. Shared context and policy apply across the system. A separate inset shows the host harness supporting all four processes through main-task and scoped-operation workspaces, with work briefs and referenced findings exchanged between them. Structured computation, semantic judgement and generative investigation are shared harness capabilities.</desc>
