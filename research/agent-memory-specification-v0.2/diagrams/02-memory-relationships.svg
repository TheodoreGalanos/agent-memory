<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Connected memory</title><desc id="desc">An episode supports a claim and is the derivation source for a procedure. A procedure depends on knowledge. Conflicting claims link symmetrically. An event triggers an investigation intention.</desc>
