<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="887" viewBox="0 0 1200 887" role="img" aria-labelledby="title desc">
<title id="title">Three interacting operating loops</title><desc id="desc">The action loop uses a bounded workspace and can return findings from a scoped investigation. The learning loop separates formation and scoped consolidation, with maintenance receiving feedback and committed change events passing through activation. The intention loop records state in memory and uses host events and result evidence.</desc>
