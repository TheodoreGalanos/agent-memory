<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">From evidence to policy-directed action</title><desc id="desc">The harness prepares actual evidence and a bounded question, then obtains a typed Jev assessment or service status. The responsible process applies policy to act, investigate or preserve an unresolved result. Investigation returns new material for a revised packet. Decisions and provenance are recorded; subsequent results supply outcome evidence.</desc>
<rect width="1200" height="780" fill="white"/>
<defs>
<marker id="line" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L11,5 L0,10 Z" fill="#718090"/></marker>
<marker id="teal" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L11,5 L0,10 Z" fill="#176D61"/></marker>
<marker id="blue" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L11,5 L0,10 Z" fill="#315B86"/></marker>
<marker id="purple" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L11,5 L0,10 Z" fill="#745A93"/></marker>
<marker id="gold" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L11,5 L0,10 Z" fill="#9A6B25"/></marker>
</defs>
<rect x="60" y="20" width="350" height="115" rx="12" fill="#F4F6F8" stroke="#718090" stroke-width="2"/>
<text x="235" y="56" font-family="Lato, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#243447">Prepare the packet</text>
<text x="235" y="89" font-family="Lato, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#243447">Actual evidence and scope</text>
<text x="235" y="118" font-family="Lato, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#243447">Question and outcomes</text>
<rect x="505" y="20" width="380" height="115" rx="12" fill="#EAF4EF" stroke="#176D61" stroke-width="2"/>
<text x="695" y="56" font-family="Lato, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#176D61">Request an assessment</text>
<text x="695" y="89" font-family="Lato, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#243447">Jev returns a typed answer</text>
<text x="695" y="118" font-family="Lato, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#243447">or the call reports a failure</text>
<path d="M410,77 L505,77" fill="none" stroke="#718090" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#line)"/>
<path d="M885,77 L1070,77 L1070,214" fill="none" stroke="#718090" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#line)"/>
<text x="1047" y="140" font-family="Lato, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="end" fill="#586778">answer or</text>
<text x="1047" y="166" font-family="Lato, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="end" fill="#586778">service status</text>
<rect x="340" y="214" width="815" height="120" rx="12" fill="#F4F6F8" stroke="#718090" stroke-width="2"/>
<text x="747" y="250" font-family="Lato, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#243447">Owning process applies policy</text>
<text x="747" y="285" font-family="Lato, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#243447">Evidence, scope and evaluated conditions for action</text>
<text x="747" y="315" font-family="Lato, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#243447">Required checks and remaining resources</text>
<path d="M450,334 L450,372 L225,372 L225,422" fill="none" stroke="#718090" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#line)"/>
<path d="M675,334 L675,395 L600,395 L600,422" fill="none" stroke="#718090" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#line)"/>
<path d="M970,334 L970,422" fill="none" stroke="#718090" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#line)"/>
<rect x="60" y="422" width="345" height="125" rx="12" fill="#EAF4EF" stroke="#176D61" stroke-width="2"/>
<text x="232.5" y="463" font-family="Lato, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#176D61">Routine action</text>
<text x="232.5" y="501" font-family="Lato, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#243447">Apply the permitted operation</text>
<text x="232.5" y="532" font-family="Lato, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#243447">Keep its scoped basis</text>
<rect x="435" y="422" width="345" height="125" rx="12" fill="#F1ECF7" stroke="#745A93" stroke-width="2"/>
<text x="607.5" y="463" font-family="Lato, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#745A93">Investigate</text>
<text x="607.5" y="501" font-family="Lato, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#243447">Retrieve, delegate or repair</text>
<text x="607.5" y="532" font-family="Lato, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#243447">Prepare a revised packet</text>
<rect x="810" y="422" width="345" height="125" rx="12" fill="#FBF5EB" stroke="#9A6B25" stroke-width="2"/>
<text x="982.5" y="463" font-family="Lato, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#9A6B25">Unresolved result</text>
<text x="982.5" y="501" font-family="Lato, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#243447">Use the defined fallback</text>
<text x="982.5" y="532" font-family="Lato, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#243447">Record any needed user input</text>
<path d="M500,547 L500,586 L20,586 L20,172 L235,172 L235,135" fill="none" stroke="#745A93" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#purple)" stroke-dasharray="7 5"/>
<text x="61" y="197" font-family="Lato, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#745A93">further evidence / revised candidate</text>
<path d="M225,547 L225,640" fill="none" stroke="#718090" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#line)" stroke-dasharray="7 5"/>
<path d="M600,547 L600,640" fill="none" stroke="#718090" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#line)" stroke-dasharray="7 5"/>
<path d="M982,547 L982,640" fill="none" stroke="#718090" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#line)" stroke-dasharray="7 5"/>
<rect x="60" y="640" width="1095" height="115" rx="12" fill="#F4F6F8" stroke="#718090" stroke-width="2"/>
<text x="607" y="678" font-family="Lato, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#243447">Record the decision and its basis</text>
<text x="607" y="711" font-family="Lato, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#243447">Link the packet, assessment and policy response.</text>
<text x="607" y="742" font-family="Lato, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#243447">Subsequent results provide outcome evidence.</text>
</svg>
