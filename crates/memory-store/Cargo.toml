[package]
name = "memory-store"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
memory-domain = { path = "../memory-domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v7"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "any", "sqlite", "postgres"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "fs"] }
thiserror = "2"
object_store = { version = "0.14.2", default-features = false, features = ["fs"] }
bytes = "1"
csv = "1"

[dev-dependencies]
tempfile = "3"

